version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fastfood_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fastfood_user
      POSTGRES_PASSWORD: fastfood_password
      POSTGRES_DB: fastfood_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastfood_user -d fastfood_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
